banking_knowledge_graph:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth                          # Usa gcloud auth application-default login
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: banking_curated
      location: "{{ env_var('GCP_REGION', 'us-central1') }}"
      threads: 4
      timeout_seconds: 300

    ci:
      type: bigquery
      method: oauth                          # WIF genera credenciales ADC automáticamente
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: banking_curated
      location: us-central1
      threads: 4
      timeout_seconds: 300
