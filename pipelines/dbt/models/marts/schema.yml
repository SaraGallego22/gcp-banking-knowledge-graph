version: 2

models:
  - name: dim_customers
    description: "Dimensión cliente con métricas agregadas de cuentas"
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: total_accounts
        tests: [not_null]
      - name: segment
        tests:
          - accepted_values:
              values: [retail, premium, corporate, sme]

  - name: dim_merchants
    description: "Dimensión comercio con métricas de volumen"
    columns:
      - name: merchant_id
        tests: [unique, not_null]

  - name: fact_transactions
    description: "Tabla de hechos con todas las claves foráneas denormalizadas"
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
